<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unwrap Your Gift</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0b0f19 100%);
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        .title-font {
            font-family: 'Fredoka', cursive, sans-serif;
        }

        /* 3D Scene Perspective */
        .scene {
            perspective: 1400px;
        }

        .gift-box-wrapper {
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gift-box-wrapper:hover:not(.opened) {
            transform: scale(1.03) rotateY(6deg) rotateX(4deg);
        }

        .gift-box-wrapper:active:not(.opened) {
            transform: scale(0.97);
        }

        /* Lid Fly off animation */
        .lid-fly-off {
            animation: flyLidOff 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards !important;
        }

        @keyframes flyLidOff {
            0% {
                transform: translateY(0) rotateX(0deg) rotateZ(0deg) scale(1);
                opacity: 1;
            }
            35% {
                transform: translateY(-120px) rotateX(-35deg) rotateZ(12deg) scale(1.08);
                opacity: 1;
            }
            100% {
                transform: translateY(-800px) rotateX(160deg) rotateZ(-45deg) scale(0.5);
                opacity: 0;
            }
        }

        /* Box Front Panel Unfold / Slide Down */
        .front-panel-open {
            transform: rotateX(-100deg);
            transform-origin: bottom center;
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease;
        }

        /* Untie Ribbons */
        .untie-v {
            transform: scaleY(0) !important;
            opacity: 0 !important;
        }
        .untie-h {
            transform: scaleX(0) !important;
            opacity: 0 !important;
        }
        .untie-bow {
            transform: scale(1.8) rotate(180deg) !important;
            opacity: 0 !important;
        }

        /* Revealed Gift Image Floating & Pop */
        .gift-revealed {
            animation: floatGently 3.5s ease-in-out infinite alternate;
        }

        @keyframes floatGently {
            0% {
                transform: translateY(0px) scale(1) rotate(0deg);
            }
            50% {
                transform: translateY(-16px) scale(1.03) rotate(2deg);
            }
            100% {
                transform: translateY(-26px) scale(1.01) rotate(-2deg);
            }
        }

        /* Pulsing Glow Animation for Unopened Box */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 25px rgba(244, 63, 94, 0.35), 0 20px 40px rgba(0,0,0,0.5); }
            50% { box-shadow: 0 0 50px rgba(244, 63, 94, 0.75), 0 20px 50px rgba(0,0,0,0.6); }
        }

        .pulse-box {
            animation: pulseGlow 2.5s infinite;
        }

        /* Sparkle Particle Styling */
        .sparkle {
            position: absolute;
            pointer-events: none;
            background: radial-gradient(circle, #ffffff 10%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            animation: sparkleAnim 1.6s linear infinite;
        }

        @keyframes sparkleAnim {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(180deg); opacity: 1; }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen text-slate-100 p-6 select-none">

    <header class="text-center mt-6 z-10">
        <h1 class="title-font text-4xl sm:text-6xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-400 via-rose-300 to-amber-300 drop-shadow-lg">
            Unwrap Your Surprise!
        </h1>
        <p id="subPrompt" class="text-rose-200/80 text-base sm:text-lg mt-3 font-medium tracking-wide">
            Click the box to see what's inside ✨
        </p>
    </header>

    <main class="relative flex items-center justify-center my-auto w-full max-w-2xl aspect-square">
        <!-- Ambient Background Glow -->
        <div id="ambientGlow" class="absolute w-[360px] h-[360px] sm:w-[480px] sm:h-[480px] rounded-full bg-rose-500/20 blur-3xl transition-all duration-1000"></div>

        <!-- 3D Scene Wrapper (Enlarged size: 380px to 440px) -->
        <div class="scene w-[340px] h-[340px] sm:w-[420px] sm:h-[420px] relative flex items-center justify-center">
            
            <!-- Sparkles Container -->
            <div id="sparkleContainer" class="absolute inset-0 pointer-events-none z-30"></div>

            <!-- Gift Box Outer -->
            <div id="giftBox" onclick="unpackGift()" class="gift-box-wrapper pulse-box relative w-full h-full cursor-pointer rounded-3xl bg-gradient-to-br from-rose-600 via-pink-600 to-rose-700 shadow-2xl flex flex-col justify-end items-center border border-rose-400/40">
                
                <!-- REVEALED PNG CONTENT INSIDE -->
                <div id="revealedContent" class="absolute inset-0 flex flex-col items-center justify-center p-8 z-0 opacity-0 transform scale-30 transition-all duration-700 cubic-bezier(0.34, 1.56, 0.64, 1)">
                    <img id="giftImage" src="" alt="Surprise Gift PNG" class="max-w-[88%] max-h-[88%] object-contain drop-shadow-[0_25px_35px_rgba(0,0,0,0.65)]">
                </div>

                <!-- BOX FRONT PANEL & BODY DETAILS -->
                <div id="boxFrontPanel" class="absolute inset-0 rounded-3xl overflow-hidden pointer-events-none z-10 shadow-inner transition-all duration-700">
                    <!-- Ribbon Horizontal (Body) -->
                    <div id="ribbonBodyH" class="ribbon-horizontal absolute top-1/2 -translate-y-1/2 left-0 w-full h-14 sm:h-16 bg-gradient-to-r from-amber-300 via-yellow-200 to-amber-400 shadow-lg"></div>
                    <!-- Ribbon Vertical (Body) -->
                    <div id="ribbonBodyV" class="ribbon-vertical absolute left-1/2 -translate-x-1/2 top-0 h-full w-14 sm:w-16 bg-gradient-to-b from-amber-300 via-yellow-200 to-amber-400 shadow-lg"></div>
                </div>

                <!-- BOX LID (Flies off on open) -->
                <div id="boxLid" class="absolute -top-6 -left-4 -right-4 h-28 sm:h-32 bg-gradient-to-br from-rose-500 to-pink-600 rounded-2xl shadow-2xl z-20 border-b-4 border-rose-800/60 flex items-center justify-center transition-all">
                    
                    <!-- Lid Ribbon Vertical -->
                    <div id="ribbonLidV" class="ribbon-vertical absolute left-1/2 -translate-x-1/2 top-0 h-full w-14 sm:w-16 bg-gradient-to-b from-amber-300 via-yellow-200 to-amber-400 shadow-md"></div>
                    <!-- Lid Ribbon Horizontal -->
                    <div id="ribbonLidH" class="ribbon-horizontal absolute top-1/2 -translate-y-1/2 left-0 w-full h-14 sm:h-16 bg-gradient-to-r from-amber-300 via-yellow-200 to-amber-400 shadow-md"></div>

                    <!-- Decorative Bow SVG -->
                    <div id="bowWrapper" class="bow-svg absolute -top-14 sm:-top-16 z-30 filter drop-shadow-2xl">
                        <svg width="120" height="90" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Left Loop -->
                            <path d="M50 40 C 15 5, -5 25, 50 40 Z" fill="url(#bowGrad)" stroke="#b45309" stroke-width="1.5"/>
                            <!-- Right Loop -->
                            <path d="M50 40 C 85 5, 105 25, 50 40 Z" fill="url(#bowGrad)" stroke="#b45309" stroke-width="1.5"/>
                            <!-- Left Tail -->
                            <path d="M44 42 L 15 78 L 32 72 L 47 46 Z" fill="url(#bowGrad)" stroke="#b45309" stroke-width="1"/>
                            <!-- Right Tail -->
                            <path d="M56 42 L 85 78 L 68 72 L 53 46 Z" fill="url(#bowGrad)" stroke="#b45309" stroke-width="1"/>
                            <!-- Knot -->
                            <circle cx="50" cy="40" r="10" fill="#fef08a" stroke="#b45309" stroke-width="2"/>
                            <!-- Gradient Definition -->
                            <defs>
                                <linearGradient id="bowGrad" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" stop-color="#fef08a"/>
                                    <stop offset="50%" stop-color="#facc15"/>
                                    <stop offset="100%" stop-color="#ca8a04"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <footer class="mb-8 z-10 flex flex-col items-center gap-3">
        <button id="actionBtn" onclick="toggleGiftState()" class="px-8 py-3.5 bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-400 hover:to-pink-500 active:scale-95 text-white font-bold text-lg rounded-2xl transition duration-300 shadow-xl flex items-center gap-3 border border-rose-300/30">
            <i id="actionIcon" class="fa-solid fa-gift"></i>
            <span id="actionText">Tap Gift to Open</span>
        </button>
    </footer>

    <script>
        /* ========================================================================
         * EASY CUSTOMIZATION: 
         * Change the GIFT_IMAGE_URL constant below to any PNG image link!
         * ======================================================================== */
        const GIFT_IMAGE_URL = './Anji40.png';

        let isOpened = false;
        let sparkleInterval = null;

        // Initialize gift image on load
        document.addEventListener('DOMContentLoaded', () => {
            const giftImg = document.getElementById('giftImage');
            giftImg.src = GIFT_IMAGE_URL;
            giftImg.onerror = function() {
                // Fallback placeholder image if the link fails
                this.src = 'https://placehold.co/400x400/e11d48/ffffff?text=🎁+Surprise!';
            };
        });

        // Web Audio API Sound Generator
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playUnwrapSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            // Ribbon sliding sound
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(250, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.35);
            
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);

            // Lid Pop Sound
            setTimeout(() => {
                const popOsc = audioCtx.createOscillator();
                const popGain = audioCtx.createGain();
                popOsc.type = 'sine';
                popOsc.frequency.setValueAtTime(140, audioCtx.currentTime);
                popOsc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.2);

                popGain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                popGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

                popOsc.connect(popGain);
                popGain.connect(audioCtx.destination);

                popOsc.start();
                popOsc.stop(audioCtx.currentTime + 0.2);
            }, 260);
        }

        // Action toggle (from button or click on gift)
        function toggleGiftState() {
            if (!isOpened) {
                unpackGift();
            } else {
                resetGift();
            }
        }

        // Unpack / Open Gift Animation
        function unpackGift() {
            if (isOpened) return;
            isOpened = true;

            playUnwrapSound();

            const giftBox = document.getElementById('giftBox');
            const boxLid = document.getElementById('boxLid');
            const boxFront = document.getElementById('boxFrontPanel');
            const bow = document.getElementById('bowWrapper');
            const ribbonsH = [document.getElementById('ribbonBodyH'), document.getElementById('ribbonLidH')];
            const ribbonsV = [document.getElementById('ribbonBodyV'), document.getElementById('ribbonLidV')];
            const revealed = document.getElementById('revealedContent');
            const glow = document.getElementById('ambientGlow');
            const subPrompt = document.getElementById('subPrompt');

            // Disable pulse & hover state
            giftBox.classList.remove('pulse-box');
            giftBox.classList.add('opened');

            // 1. Untie Bow & Ribbons
            bow.classList.add('untie-bow');
            ribbonsH.forEach(r => r.classList.add('untie-h'));
            ribbonsV.forEach(r => r.classList.add('untie-v'));

            // 2. Lid Flies Off
            setTimeout(() => {
                boxLid.classList.add('lid-fly-off');
            }, 250);

            // 3. Unfold Front Panel & Reveal Hidden PNG
            setTimeout(() => {
                boxFront.classList.add('front-panel-open');
                
                revealed.classList.remove('opacity-0', 'scale-30');
                revealed.classList.add('opacity-100', 'scale-100', 'gift-revealed');
                
                glow.classList.remove('bg-rose-500/20');
                glow.classList.add('bg-amber-400/35', 'scale-125');

                subPrompt.innerText = "Ta-da! Here is your gift 🎉";

                // Update Action Button
                document.getElementById('actionIcon').className = 'fa-solid fa-rotate-left';
                document.getElementById('actionText').innerText = 'Re-wrap Gift';

                triggerConfetti();
                startSparkles();
            }, 500);
        }

        // Reset Box State
        function resetGift() {
            isOpened = false;

            const giftBox = document.getElementById('giftBox');
            const boxLid = document.getElementById('boxLid');
            const boxFront = document.getElementById('boxFrontPanel');
            const bow = document.getElementById('bowWrapper');
            const ribbonsH = [document.getElementById('ribbonBodyH'), document.getElementById('ribbonLidH')];
            const ribbonsV = [document.getElementById('ribbonBodyV'), document.getElementById('ribbonLidV')];
            const revealed = document.getElementById('revealedContent');
            const glow = document.getElementById('ambientGlow');
            const subPrompt = document.getElementById('subPrompt');

            stopSparkles();

            // Re-enable pulse
            giftBox.classList.add('pulse-box');
            giftBox.classList.remove('opened');

            // Reset Lid, Front panel & Ribbons
            boxLid.classList.remove('lid-fly-off');
            boxFront.classList.remove('front-panel-open');
            bow.classList.remove('untie-bow');
            ribbonsH.forEach(r => r.classList.remove('untie-h'));
            ribbonsV.forEach(r => r.classList.remove('untie-v'));

            // Hide Revealed Image
            revealed.classList.remove('opacity-100', 'scale-100', 'gift-revealed');
            revealed.classList.add('opacity-0', 'scale-30');

            // Reset Glow & Prompt
            glow.classList.remove('bg-amber-400/35', 'scale-125');
            glow.classList.add('bg-rose-500/20');

            subPrompt.innerText = "Click the box to see what's inside ✨";

            // Reset Action Button
            document.getElementById('actionIcon').className = 'fa-solid fa-gift';
            document.getElementById('actionText').innerText = 'Tap Gift to Open';
        }

        // Confetti Burst Effect
        function triggerConfetti() {
            var count = 220;
            var defaults = { origin: { y: 0.6 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 30, startVelocity: 60 });
            fire(0.2, { spread: 70 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 130, startVelocity: 25, decay: 0.92, scalar: 1.25 });
            fire(0.1, { spread: 130, startVelocity: 45 });
        }

        // Sparkle Particles Animation
        function startSparkles() {
            const container = document.getElementById('sparkleContainer');
            sparkleInterval = setInterval(() => {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                const size = Math.random() * 18 + 10;
                sparkle.style.width = `${size}px`;
                sparkle.style.height = `${size}px`;
                sparkle.style.left = `${Math.random() * 90 + 5}%`;
                sparkle.style.top = `${Math.random() * 90 + 5}%`;
                
                container.appendChild(sparkle);

                setTimeout(() => {
                    sparkle.remove();
                }, 1600);
            }, 220);
        }

        function stopSparkles() {
            clearInterval(sparkleInterval);
            document.getElementById('sparkleContainer').innerHTML = '';
        }
    </script>
</body>
</html>
